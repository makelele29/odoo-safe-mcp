[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-safe-mcp"
version = "2.0.0"
description = "Deterministic AI Firewall and Model Context Protocol (MCP) Server for Odoo ERP with Human-in-the-Loop approvals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Odoo Safe MCP", email = "soporte@odoosafemcp.stream" }
]
keywords = [
    "odoo",
    "erp",
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "claude",
    "cursor",
    "security",
    "human-in-the-loop"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://odoosafemcp.stream"
Documentation = "https://odoosafemcp.stream/#how"
Repository = "https://github.com/tu-usuario/odoo-safe-mcp"
"Bug Tracker" = "https://github.com/tu-usuario/odoo-safe-mcp/issues"
"Get Pro API Key" = "https://odoosafemcp.stream/#pricing"

[project.scripts]
odoo-safe-mcp = "odoo_safe_mcp.server:main"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
