name: Tests & Publish to PyPI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Security Firewall Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Execute Odoo Firewall Test Suite
        run: python -m pytest -q

  publish:
    name: Publish Package to PyPI
    needs: test
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Requerido para PyPI Trusted Publishing (sin tokens manuales)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version and pinned Guard key
        run: |
          python -m pip install -e .
          python -c "from odoo_safe_mcp.trust import TRUSTED_GUARD_KEYS as k; assert k, 'Pin the production Guard key in odoo_safe_mcp/trust.py before publishing'"
          if [ "${{ github.event_name }}" = "release" ]; then
            python -c "import os, odoo_safe_mcp; assert f'v{odoo_safe_mcp.__version__}' == os.environ['GITHUB_REF_NAME'], (odoo_safe_mcp.__version__, os.environ['GITHUB_REF_NAME'])"
          fi
      - name: Build distribution packages
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
